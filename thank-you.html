
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | FYRSTERLING</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #005A7D;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 650px;
      padding: 70px 25px;
    }

    h1 {
      font-size: 27px;
      font-weight: 400;
      letter-spacing: 3px;
      line-height: 1.5;
      margin-bottom: 35px;
    }

    p {
      font-size: 15px;
      line-height: 2;
      margin-bottom: 25px;
    }

    .back {
      display: inline-block;
      color: white;
      text-decoration: none;
      border: 1px solid white;
      padding: 16px 30px;
      margin-top: 25px;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .logo {
      display: block;
      width: 110px;
      max-width: 35%;
      height: auto;
      margin: 75px auto 0;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 21px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>THANK YOU FOR YOUR ENQUIRY</h1>

    <p>
      Your purchase enquiry has been received.
    </p>

    <p>
      FYRSTERLING will contact you shortly
      with further details.
    </p>

    <a class="back" href="/collection.html">
      BACK TO COLLECTION
    </a>

    <img
      class="logo"
      src="/images/Symbol.png"
      alt="FYRSTERLING symbol"
    >
  </main>
</body>
</html>
