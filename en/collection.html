
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AETERNUM Smykkekollektion | Guld og Diamanter | FYRSTERLING</title>
  <meta name="description" content="Udforsk AETERNUM smykkekollektionen fra FYRSTERLING. Oplev eksklusive ringe, halskæder, øreringe og armbånd i 14 karat guld, rosaguld og sterlingsølv med diamanter.">

  <link rel="canonical" href="https://fyrsterling.com/collection.html">
  <link rel="alternate" hreflang="da" href="https://fyrsterling.com/collection.html">
  <link rel="alternate" hreflang="en" href="https://fyrsterling.com/en/collection.html">
  <link rel="alternate" hreflang="x-default" href="https://fyrsterling.com/collection.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #142a46;
      --white: #FFFFFF;
      --text: #4a4a4a;
      --line: #e8e8e8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      max-width: 100%;
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      background: var(--white);
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    /* HEADER */

    .site-header {
      background: #FFFFFF;
      text-align: center;
      padding: 25px 20px 18px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      display: inline-block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      font-weight: normal;
      letter-spacing: 5px;
      text-decoration: none;
      margin-bottom: 18px;
    }

    .main-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 27px;
    }

    .main-nav a {
      font-family: "Barlow", Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1.4px;
      text-decoration: none;
      padding-bottom: 5px;
    }

    .main-nav a:hover,
    .main-nav a.active {
      border-bottom: 1px solid var(--navy);
    }

    /* LANGUAGE SWITCH */

    .language-switch {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-left: 10px;
      font-family: "Barlow", Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .language-switch a {
      font-size: 11px;
      letter-spacing: 1px;
    }

    .language-switch a[aria-current="page"] {
      border-bottom: 1px solid var(--navy);
    }

    .language-divider {
      color: #999999;
    }

    /* COLLECTION INTRODUCTION */

    .intro {
      text-align: center;
      padding: 43px 20px 35px;
    }

    .intro h1 {
      margin: 0 0 16px;
      font-family: "Barlow", Arial, sans-serif;
      font-size: 36px;
      font-weight: 400;
      letter-spacing: 2px;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .intro p {
      margin: 0;
      font-family: "Barlow", Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 2px;
      color: #777777;
    }

    /* COLLECTION GRID */

    .collection {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 30px 90px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 48px 24px;
      width: 100%;
    }

    .product {
      min-width: 0;
      width: 100%;
      text-align: center;
    }

    .product-image {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #f7f7f7;
      text-decoration: none;
    }

    .product-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.35s ease;
    }

    .product-image:hover img {
      transform: scale(1.025);
    }

    .product h2 {
      margin: 20px 0 10px;
      font-family: "Barlow", Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .product p {
      margin: 8px 0;
      font-family: "Barlow", Arial, sans-serif;
      font-size: 13px;
      color: #777777;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .site-header {
        padding: 22px 15px 16px;
      }

      .logo {
        font-size: 24px;
        letter-spacing: 3px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 10px;
        letter-spacing: 0.7px;
      }

      .language-switch {
        margin-left: 3px;
        gap: 7px;
      }

      .language-switch a {
        font-size: 10px;
      }

      .intro {
        padding: 35px 20px 30px;
      }

      .intro h1 {
        font-size: 28px;
      }

      .collection {
        padding: 15px 12px 60px;
      }

      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 30px 12px;
      }

      .product h2 {
        font-size: 13px;
        line-height: 1.4;
      }

      .product p {
        font-size: 12px;
        line-height: 1.5;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="site-header">
    <a href="/" class="logo">FYRSTERLING</a>

    <nav class="main-nav" aria-label="Hovednavigation">
      <a href="/collection.html" class="active" aria-current="page">SMYKKER</a>
      <a href="/services.html">SERVICES</a>
      <a href="/our-story.html">MAISON</a>
      <a href="/appointments.html">BOOK TID</a>
      <a href="/contact.html">KONTAKT</a>
      <a href="/faq.html">FAQ</a>

      <span class="language-switch" aria-label="Vælg sprog">
        <a href="/collection.html" lang="da" aria-current="page">DA</a>
        <span class="language-divider" aria-hidden="true">|</span>
        <a href="/en/collection.html" lang="en">EN</a>
      </span>
    </nav>
  </header>

  <!-- COLLECTION HEADING -->

  <section class="intro">
    <h1>AETERNUM</h1>
    <p>KOLLEKTIONEN</p>
  </section>

  <!-- COLLECTION PRODUCTS -->

  <main class="collection">
    <div class="products" id="products"></div>
  </main>

  <script>
    /*
      Original product identifiers are retained
      for compatibility with product.html.
    */

    const products = [
      ["Ring", "Yellow Gold"],
      ["Necklace", "Silver"],
      ["Earrings", "Rose Gold"],
      ["Bracelet", "Yellow Gold"],
      ["Ring", "Silver"],
      ["Necklace", "Rose Gold"],
      ["Bracelet", "Silver"],
      ["Earrings", "Yellow Gold"],
      ["Necklace", "Yellow Gold"],
      ["Ring", "Rose Gold"],
      ["Earrings", "Silver"],
      ["Bracelet", "Rose Gold"]
    ];

    /* Original image filenames */

    const metals = {
      "Yellow Gold": "Guld",
      "Rose Gold": "Rose gold",
      "Silver": "Sølv"
    };

    const types = {
      "Ring": "ring",
      "Necklace": "halskæde",
      "Earrings": "øreringe",
      "Bracelet": "armbånd"
    };

    /* Danish display names */

    const danishTypes = {
      "Ring": "RING",
      "Necklace": "HALSKÆDE",
      "Earrings": "ØRERINGE",
      "Bracelet": "ARMBÅND"
    };

    const danishMetals = {
      "Yellow Gold": "14 KARAT GULD",
      "Rose Gold": "14 KARAT ROSAGULD",
      "Silver": "STERLINGSØLV"
    };

    /* Original prices */

    const prices = {
      "Ring": {
        "Yellow Gold": 9600,
        "Rose Gold": 9600,
        "Silver": 3200
      },
      "Earrings": {
        "Yellow Gold": 5200,
        "Rose Gold": 5200,
        "Silver": 3000
      },
      "Necklace": {
        "Yellow Gold": 9100,
        "Rose Gold": 9100,
        "Silver": 3600
      },
      "Bracelet": {
        "Yellow Gold": 6500,
        "Rose Gold": 6500,
        "Silver": 3200
      }
    };

    document.getElementById("products").innerHTML =
      products.map(([name, metal]) => {
        const filename = `${metals[metal]} ${types[name]}.jpeg`;

        return `
          <article class="product">
            <a
              class="product-image"
              href="/product.html?type=${encodeURIComponent(name)}&metal=${encodeURIComponent(metal)}"
              aria-label="Se AETERNUM ${danishTypes[name].toLowerCase()} i ${danishMetals[metal].toLowerCase()}"
            >
              <img
                src="/images/${encodeURIComponent(filename)}"
                alt="AETERNUM ${danishTypes[name].toLowerCase()} i ${danishMetals[metal].toLowerCase()}"
                loading="lazy"
              >
            </a>

            <h2>AETERNUM ${danishTypes[name]}</h2>
            <p>${danishMetals[metal]}</p>
            <p>${prices[name][metal].toLocaleString("da-DK")} DKK</p>
          </article>
        `;
      }).join("");
  </script>

</body>
</html>
