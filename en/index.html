
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FYRSTERLING | Fine Jewellery & Diamonds</title>
<meta name="description" content="Discover FYRSTERLING fine jewellery and the AETERNUM collection in 14-karat gold, sterling silver and lab-grown diamonds.">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<link rel="canonical" href="https://fyrsterling.com/en/">
<link rel="alternate" hreflang="da" href="https://fyrsterling.com/">
<link rel="alternate" hreflang="en" href="https://fyrsterling.com/en/">
<link rel="alternate" hreflang="x-default" href="https://fyrsterling.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {--navy:#142a46;--white:#FFFFFF}
* {box-sizing:border-box}
html {scroll-behavior:smooth}
body {
  margin:0;background:#FFFFFF;color:var(--navy);
  font-family:Georgia,"Times New Roman",serif;
  -webkit-font-smoothing:antialiased;
}
.site-header {
  position:absolute;top:0;left:0;right:0;z-index:100;
  padding:25px 20px 18px;background:transparent;
  text-align:center;transition:background .3s;
}
.site-logo {
  display:inline-block;margin-bottom:18px;color:#FFFFFF;
  text-decoration:none;font-size:29px;letter-spacing:5px;
}
.site-nav {
  display:flex;justify-content:center;align-items:center;
  flex-wrap:wrap;gap:27px;
}
.site-nav a {
  color:#FFFFFF;text-decoration:none;
  font-family:"Barlow",Arial,sans-serif;
  font-size:11px;font-weight:400;
  letter-spacing:1.4px;padding-bottom:5px;
}
.site-nav a:hover {border-bottom:1px solid currentColor}
.nav-dropdown {
  position:relative;display:inline-flex;align-items:center;gap:5px;
}
.dropdown-toggle {
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:22px;padding:0;border:0;
  background:transparent;color:#FFFFFF;cursor:pointer;
}
.dropdown-toggle svg {
  width:11px;height:11px;transition:transform .2s;
}
.dropdown-menu {
  position:absolute;top:100%;left:50%;
  transform:translateX(-50%);z-index:200;
  min-width:190px;padding:19px 0 10px;
  background:#FFFFFF;border:1px solid #eeeeee;
  box-shadow:0 12px 25px rgba(0,0,0,.06);
  text-align:left;opacity:0;visibility:hidden;
  pointer-events:none;
  transition:opacity .2s,visibility .2s;
}
.dropdown-menu a {
  display:block;padding:12px 22px;
  border-bottom:0!important;color:var(--navy)!important;
  font-family:"Barlow",Arial,sans-serif;
  font-size:11px;letter-spacing:1.3px;white-space:nowrap;
}
.dropdown-menu a:hover,
.dropdown-menu a:focus-visible {background:#f5f6f8}
.nav-dropdown:hover .dropdown-menu,
.nav-dropdown:focus-within .dropdown-menu,
.nav-dropdown.is-open .dropdown-menu {
  opacity:1;visibility:visible;pointer-events:auto;
}
.nav-dropdown:hover .dropdown-toggle svg,
.nav-dropdown:focus-within .dropdown-toggle svg,
.nav-dropdown.is-open .dropdown-toggle svg {
  transform:rotate(180deg);
}
.language-switch {
  display:inline-flex;align-items:center;gap:9px;
  margin-left:10px;color:#FFFFFF;
  font-family:"Barlow",Arial,sans-serif;font-size:11px;
}
.language-switch a {font-size:11px;letter-spacing:1px}
.language-switch a[aria-current="page"] {
  border-bottom:1px solid currentColor;
}
.language-divider {opacity:.6}
.site-header:hover,
.site-header:focus-within {background:#FFFFFF}
.site-header:hover .site-logo,
.site-header:hover .site-nav a,
.site-header:hover .language-switch,
.site-header:hover .dropdown-toggle,
.site-header:focus-within .site-logo,
.site-header:focus-within .site-nav a,
.site-header:focus-within .language-switch,
.site-header:focus-within .dropdown-toggle {
  color:var(--navy);
}
.visual {
  position:relative;width:100%;min-height:100vh;
  min-height:100svh;overflow:hidden;
  background:#050505;color:#FFFFFF;
}
.visual video {
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
}
.visual::after {
  content:"";position:absolute;inset:0;
  background:rgba(0,0,0,.14);pointer-events:none;
}
.video-title {
  position:absolute;top:43%;left:50%;
  transform:translate(-50%,-50%);z-index:2;
  width:90%;margin:0;text-align:center;color:#FFFFFF;
  font-size:clamp(30px,4vw,54px);
  font-weight:normal;letter-spacing:2px;
}
.video-explore {
  position:absolute;left:50%;bottom:11%;
  transform:translateX(-50%);z-index:2;
  width:90%;text-align:center;
}
.video-explore p {margin:0 0 22px;font-size:18px}
.explore-button {
  display:inline-block;padding:14px 32px;
  border:1px solid #FFFFFF;color:#FFFFFF;
  background:transparent;text-decoration:none;
  font-family:"Barlow",Arial,sans-serif;
  font-size:11px;letter-spacing:1.6px;
  transition:background .2s,color .2s;
}
.explore-button:hover {background:#FFFFFF;color:var(--navy)}
.editorial-section {background:#FFFFFF;padding:60px 30px}
.editorial-grid {
  max-width:1200px;margin:auto;display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));gap:50px;
}
.editorial-card {
  display:block;color:var(--navy);text-decoration:none;
}
.editorial-image-wrap {
  display:block;width:100%;aspect-ratio:4/5;
  overflow:hidden;background:#f7f7f7;
}
.editorial-image {
  display:block;width:100%;height:100%;
  object-fit:cover;transition:transform .45s;
}
.editorial-card:hover .editorial-image {
  transform:scale(1.025);
}
.editorial-title {
  margin:20px 0 0;text-align:center;
  font-family:"Barlow",Arial,sans-serif;
  font-size:13px;font-weight:400;letter-spacing:1.6px;
}
.jewellery-slider {
  background:#FFFFFF;padding:55px 24px 80px;
}
.slider-container {max-width:1320px;margin:0 auto}
.slider-stage {position:relative;padding:0 45px}
.slider-heading {
  margin:0 0 45px;text-align:center;
  font-family:"Barlow",Arial,sans-serif;
  font-size:22px;font-weight:400;letter-spacing:3px;
}
.slider-viewport {width:100%;overflow:hidden}
.slider-track {
  display:flex;transition:transform .7s ease;
  will-change:transform;
}
.slider-item {flex:0 0 25%;min-width:0;padding:0 12px}
.slider-item a {
  display:block;color:var(--navy);
  text-decoration:none;text-align:center;
}
.slider-product-image {
  display:block;width:100%;aspect-ratio:1/1;
  object-fit:contain;background:#fafafa;
}
.slider-product-name {
  margin:18px 0 6px;
  font-family:"Barlow",Arial,sans-serif;
  font-size:12px;font-weight:500;
  letter-spacing:1px;line-height:1.5;
}
.slider-product-metal {
  margin:0 0 9px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:13px;color:#666666;
}
.slider-product-price {
  margin:0;font-family:"Barlow",Arial,sans-serif;
  font-size:13px;
}
.slider-arrow {
  position:absolute;top:clamp(65px,11vw,155px);
  transform:translateY(-50%);z-index:2;
  display:flex;justify-content:center;align-items:center;
  width:38px;height:38px;border:1px solid #d8d8d8;
  border-radius:50%;background:#FFFFFF;
  color:var(--navy);font-size:22px;cursor:pointer;
}
.slider-arrow:hover {background:#f4f4f4}
#sliderPrev {left:0}
#sliderNext {right:0}
.collection-section {background:#FFFFFF}
.collection-image {display:block;width:100%;height:auto}
.home-contact {
  background:#FFFFFF;padding:45px 20px;text-align:center;
}
.home-contact-links {
  display:flex;justify-content:center;flex-wrap:wrap;
  gap:20px;font-family:"Barlow",Arial,sans-serif;
  font-size:13px;letter-spacing:1px;
}
.home-contact-links a {color:#005A7D;text-decoration:none}
.home-contact-links a:hover {text-decoration:underline}
@media(max-width:700px) {
  .site-header {padding:22px 15px 16px}
  .site-logo {font-size:24px;letter-spacing:3px}
  .site-nav {gap:13px}
  .site-nav a {font-size:10px;letter-spacing:.7px}
  .nav-dropdown {gap:2px}
  .dropdown-toggle {width:15px}
  .dropdown-menu {
    left:0;transform:none;min-width:175px;
  }
  .dropdown-menu a {font-size:11px;padding:13px 18px}
  .language-switch {margin-left:3px;gap:7px}
  .language-switch a {font-size:10px}
  .video-title {font-size:32px}
  .video-explore p {font-size:16px}
  .editorial-section {padding:45px 20px}
  .editorial-grid {grid-template-columns:1fr;gap:40px}
  .editorial-title {font-size:12px;margin-top:16px}
  .jewellery-slider {padding:45px 12px 60px}
  .slider-heading {font-size:18px;margin-bottom:30px}
  .slider-stage {padding:0 28px}
  .slider-arrow {
    top:clamp(60px,23vw,155px);
    width:27px;height:27px;font-size:19px;
  }
  .slider-item {flex-basis:50%;padding:0 7px}
  .slider-product-name {font-size:10px}
  .slider-product-metal,
  .slider-product-price {font-size:12px}
  .home-contact {padding:35px 20px}
  .home-contact-links {
    flex-direction:column;gap:16px;font-size:11px;
  }
}
@media(prefers-reduced-motion:reduce) {
  .visual video {display:none}
  .visual {background:#142a46}
  .dropdown-menu,.dropdown-toggle svg,
  .editorial-image,.slider-track {transition:none}
}
</style>
</head>

<body>

<script>
"use strict";

const dropdown = document.getElementById("jewelleryDropdown");
const toggle = document.getElementById("jewelleryToggle");

function setDropdownOpen(open) {
  dropdown.classList.toggle("is-open",open);
  toggle.setAttribute("aria-expanded",String(open));
}
toggle.addEventListener("click",() => {
  setDropdownOpen(!dropdown.classList.contains("is-open"));
});
dropdown.addEventListener("mouseenter",() => {
  if (window.matchMedia("(hover: hover)").matches)
    setDropdownOpen(true);
});
dropdown.addEventListener("mouseleave",() => setDropdownOpen(false));
dropdown.addEventListener("focusin",() => setDropdownOpen(true));
dropdown.addEventListener("focusout",event => {
  if (!dropdown.contains(event.relatedTarget)) setDropdownOpen(false);
});
document.addEventListener("click",event => {
  if (!dropdown.contains(event.target)) setDropdownOpen(false);
});
document.addEventListener("keydown",event => {
  if (event.key === "Escape") {
    setDropdownOpen(false);
    toggle.focus();
  }
});

const products = [
  ["Ring","Yellow Gold"],["Necklace","Silver"],
  ["Earrings","Rose Gold"],["Bracelet","Yellow Gold"],
  ["Ring","Silver"],["Necklace","Rose Gold"],
  ["Bracelet","Silver"],["Earrings","Yellow Gold"],
  ["Necklace","Yellow Gold"],["Ring","Rose Gold"],
  ["Earrings","Silver"],["Bracelet","Rose Gold"]
];
const fileMetals = {
  "Yellow Gold":"Guld",
  "Rose Gold":"Rose gold",
  Silver:"Sølv"
};
const fileTypes = {
  Ring:"ring",
  Necklace:"halskæde",
  Earrings:"øreringe",
  Bracelet:"armbånd"
};
const productNames = {
  Ring:"AETERNUM RING",
  Necklace:"AETERNUM NECKLACE",
  Earrings:"AETERNUM EARRINGS",
  Bracelet:"AETERNUM BRACELET"
};
const metalNames = {
  "Yellow Gold":"14K YELLOW GOLD",
  "Rose Gold":"14K ROSE GOLD",
  Silver:"STERLING SILVER"
};
const prices = {
  Ring:{"Yellow Gold":9600,"Rose Gold":9600,Silver:3200},
  Earrings:{"Yellow Gold":5200,"Rose Gold":5200,Silver:3000},
  Necklace:{"Yellow Gold":9100,"Rose Gold":9100,Silver:3600},
  Bracelet:{"Yellow Gold":6500,"Rose Gold":6500,Silver:3200}
};

for (let i=products.length-1;i>0;i--) {
  const j=Math.floor(Math.random()*(i+1));
  [products[i],products[j]]=[products[j],products[i]];
}

const track=document.getElementById("sliderTrack");
const viewport=document.getElementById("sliderViewport");
const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)");

function productCard(name,metal) {
  const filename=fileMetals[metal]+" "+fileTypes[name]+".jpeg";
  const image="/images/"+encodeURIComponent(filename);
  const url="/en/product.html?type="+encodeURIComponent(name)+
    "&metal="+encodeURIComponent(metal);
  const price=prices[name][metal].toLocaleString("da-DK");

  const item=document.createElement("div");
  item.className="slider-item";

  const link=document.createElement("a");
  link.href=url;

  const img=document.createElement("img");
  img.className="slider-product-image";
  img.src=image;
  img.alt=productNames[name]+" – "+metalNames[metal];
  img.loading="lazy";

  const title=document.createElement("p");
  title.className="slider-product-name";
  title.textContent=productNames[name];

  const material=document.createElement("p");
  material.className="slider-product-metal";
  material.textContent=metalNames[metal];

  const priceText=document.createElement("p");
  priceText.className="slider-product-price";
  priceText.textContent=price+" DKK";

  link.append(img,title,material,priceText);
  item.appendChild(link);
  return item;
}

products.forEach(p=>track.appendChild(productCard(...p)));
products.slice(0,4).forEach(p=>track.appendChild(productCard(...p)));

let index=0;
let busy=false;
let timer;
let paused=false;

function visibleCount() {
  return window.innerWidth<=700?2:4;
}
function position(animate=true) {
  track.style.transition=animate&&!reducedMotion.matches
    ?"transform .7s ease":"none";
  track.style.transform=
    "translateX(-"+(index*100/visibleCount())+"%)";
}
function next() {
  if(busy)return;
  busy=true;
  index++;
  position();
  if(reducedMotion.matches) {
    if(index>=products.length) {
      index=0;
      position(false);
    }
    busy=false;
  }
}
function previous() {
  if(busy)return;
  if(index===0) {
    index=products.length;
    position(false);
    track.offsetHeight;
  }
  busy=true;
  index--;
  position();
  if(reducedMotion.matches)busy=false;
}
track.addEventListener("transitionend",event=>{
  if(event.target!==track||event.propertyName!=="transform")return;
  if(index>=products.length) {
    index=0;
    position(false);
  }
  busy=false;
});
function startAuto() {
  clearInterval(timer);
  if(reducedMotion.matches||paused||document.hidden)return;
  timer=setInterval(next,4000);
}
function pauseAuto() {
  paused=true;
  clearInterval(timer);
}
function resumeAuto() {
  paused=false;
  startAuto();
}
document.getElementById("sliderNext").addEventListener("click",()=>{
  next();
  startAuto();
});
document.getElementById("sliderPrev").addEventListener("click",()=>{
  previous();
  startAuto();
});
const sliderStage=document.getElementById("sliderStage");
sliderStage.addEventListener("mouseenter",pauseAuto);
sliderStage.addEventListener("mouseleave",resumeAuto);
sliderStage.addEventListener("focusin",pauseAuto);
sliderStage.addEventListener("focusout",event=>{
  if(!sliderStage.contains(event.relatedTarget))resumeAuto();
});
document.addEventListener("visibilitychange",startAuto);
window.addEventListener("resize",()=>position(false));
reducedMotion.addEventListener("change",startAuto);

position(false);
startAuto();
</script>
