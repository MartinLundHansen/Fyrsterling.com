  <style>
    :root {
      --navy: #142a46;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #FFFFFF;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */

    .site-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 25px 20px 18px;
      background: transparent;
      text-align: center;
      transition: background 0.3s ease;
    }

    .site-logo {
      display: inline-block;
      color: #FFFFFF;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      font-weight: normal;
      letter-spacing: 5px;
      margin-bottom: 18px;
    }

    .site-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 27px;
    }

    .site-nav a {
      color: #FFFFFF;
      text-decoration: none;
      font-family: "Barlow", Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1.4px;
      padding-bottom: 5px;
    }

    .site-nav a:hover {
      border-bottom: 1px solid currentColor;
    }

    /* JEWELLERY DROPDOWN */

    .nav-dropdown {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .nav-dropdown > a {
      display: inline-block;
    }

    .dropdown-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #FFFFFF;
      cursor: pointer;
    }

    .dropdown-toggle svg {
      width: 11px;
      height: 11px;
      transition: transform 0.2s ease;
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      min-width: 190px;
      padding: 19px 0 10px;
      background: #FFFFFF;
      border: 1px solid #eeeeee;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.06);
      text-align: left;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 200;
    }

    .dropdown-menu a {
      display: block;
      padding: 12px 22px;
      border-bottom: 0 !important;
      color: var(--navy) !important;
      font-family: "Barlow", Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1.3px;
      white-space: nowrap;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .dropdown-menu a:hover,
    .dropdown-menu a:focus-visible {
      background: #f5f6f8;
      border-bottom: 0;
    }

    .nav-dropdown:hover .dropdown-menu,
    .nav-dropdown:focus-within .dropdown-menu,
    .nav-dropdown.is-open .dropdown-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .nav-dropdown:hover .dropdown-toggle svg,
    .nav-dropdown:focus-within .dropdown-toggle svg,
    .nav-dropdown.is-open .dropdown-toggle svg {
      transform: rotate(180deg);
    }

    /* LANGUAGE SWITCH */

    .language-switch {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-left: 10px;
      color: #FFFFFF;
      font-family: "Barlow", Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .language-switch a {
      font-size: 11px;
      letter-spacing: 1px;
    }

    .language-switch a[aria-current="page"] {
      border-bottom: 1px solid currentColor;
    }

    .language-divider {
      opacity: 0.6;
    }

    /* WHITE HEADER ON HOVER */

    .site-header:hover,
    .site-header:focus-within {
      background: #FFFFFF;
    }

    .site-header:hover .site-logo,
    .site-header:hover .site-nav a,
    .site-header:hover .language-switch,
    .site-header:hover .dropdown-toggle,
    .site-header:focus-within .site-logo,
    .site-header:focus-within .site-nav a,
    .site-header:focus-within .language-switch,
    .site-header:focus-within .dropdown-toggle {
      color: var(--navy);
    }

    /* HERO VIDEO */

    .visual {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #050505;
      color: #FFFFFF;
    }

    .visual video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.14);
      pointer-events: none;
    }

    .video-title {
      position: absolute;
      top: 43%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      width: 90%;
      margin: 0;
      text-align: center;
      color: #FFFFFF;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 4vw, 54px);
      font-weight: normal;
      letter-spacing: 2px;
    }

    .video-explore {
      position: absolute;
      left: 50%;
      bottom: 11%;
      transform: translateX(-50%);
      z-index: 2;
      width: 90%;
      text-align: center;
      color: #FFFFFF;
    }

    .video-explore p {
      margin: 0 0 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .explore-button {
      display: inline-block;
      padding: 14px 32px;
      border: 1px solid #FFFFFF;
      color: #FFFFFF;
      background: transparent;
      text-decoration: none;
      font-family: "Barlow", Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1.6px;
      transition: background 0.2s, color 0.2s;
    }

    .explore-button:hover {
      background: #FFFFFF;
      color: var(--navy);
    }

    /* AETERNUM COLLECTION */

    .collection-section {
      background: #FFFFFF;
    }

    .collection-image {
      display: block;
      width: 100%;
      height: auto;
    }

    /* CONTACT INFORMATION */

    .home-contact {
      background: #FFFFFF;
      padding: 45px 20px;
      text-align: center;
    }

    .home-contact-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      font-family: "Barlow", Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .home-contact-links a {
      color: #005A7D;
      text-decoration: none;
    }

    .home-contact-links a:hover {
      text-decoration: underline;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .site-header {
        padding: 22px 15px 16px;
      }

      .site-logo {
        font-size: 24px;
        letter-spacing: 3px;
      }

      .site-nav {
        gap: 13px;
      }

      .site-nav a {
        font-size: 10px;
        letter-spacing: 0.7px;
      }

      .nav-dropdown {
        gap: 2px;
      }

      .dropdown-toggle {
        width: 15px;
      }

      .dropdown-menu {
        left: 0;
        transform: none;
        min-width: 175px;
      }

      .dropdown-menu a {
        font-size: 11px;
        padding: 13px 18px;
      }

      .language-switch {
        margin-left: 3px;
        gap: 7px;
      }

      .language-switch a {
        font-size: 10px;
      }

      .video-title {
        font-size: 32px;
      }

      .video-explore p {
        font-size: 16px;
      }

      .home-contact {
        padding: 35px 20px;
      }

      .home-contact-links {
        flex-direction: column;
        gap: 16px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .visual video {
        display: none;
      }

      .visual {
        background: #142a46;
      }

      .dropdown-menu,
      .dropdown-toggle svg {
        transition: none;
      }
    }
  </style>
</head>

  <!-- DROPDOWN FUNCTIONALITY -->

  <script>
    const dropdown = document.getElementById("jewelleryDropdown");
    const toggle = document.getElementById("jewelleryToggle");

    function setDropdownOpen(open) {
      dropdown.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", String(open));
    }

    toggle.addEventListener("click", function () {
      setDropdownOpen(!dropdown.classList.contains("is-open"));
    });

    dropdown.addEventListener("mouseenter", function () {
      if (window.matchMedia("(hover: hover)").matches) {
        setDropdownOpen(true);
      }
    });

    dropdown.addEventListener("mouseleave", function () {
      setDropdownOpen(false);
    });

    dropdown.addEventListener("focusin", function () {
      setDropdownOpen(true);
    });

    dropdown.addEventListener("focusout", function (event) {
      if (!dropdown.contains(event.relatedTarget)) {
        setDropdownOpen(false);
      }
    });

    document.addEventListener("click", function (event) {
      if (!dropdown.contains(event.target)) {
        setDropdownOpen(false);
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        setDropdownOpen(false);
        toggle.focus();
      }
    });
  </script>
