
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AETERNUM | FYRSTERLING</title>
<meta name="description" content="AETERNUM jewellery by FYRSTERLING.">

<link id="canonicalLink" rel="canonical" href="https://fyrsterling.com/product.html">
<link id="alternateDa" rel="alternate" hreflang="da" href="https://fyrsterling.com/product.html">
<link id="alternateEn" rel="alternate" hreflang="en" href="https://fyrsterling.com/en/product.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #142a46;
  --blue: #005a7d;
  --muted: #777;
  --line: #e8e8e8;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: #fff;
  color: var(--navy);
  font-family: Georgia, "Times New Roman", serif;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
a { color: inherit; }
button, input { font: inherit; }

/* HEADER */

.site-header {
  position: relative;
  z-index: 100;
  background: #fff;
  text-align: center;
  padding: 25px 20px 18px;
  border-bottom: 1px solid var(--line);
}
.logo {
  display: inline-block;
  font-size: 29px;
  letter-spacing: 5px;
  text-decoration: none;
  margin-bottom: 18px;
}
.main-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 27px;
}
.main-nav a {
  font-family: Barlow, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 1.4px;
  text-decoration: none;
  padding-bottom: 5px;
}
.main-nav > a:hover,
.main-nav > a.active,
.language-switch a[aria-current="page"] {
  border-bottom: 1px solid var(--navy);
}
.language-switch {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin-left: 10px;
  font-family: Barlow, Arial, sans-serif;
  font-size: 11px;
}

/* JEWELLERY DROPDOWN */

.nav-dropdown {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.nav-dropdown > a {
  border-bottom: 1px solid var(--navy);
}
.dropdown-toggle {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 18px;
  height: 22px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--navy);
  cursor: pointer;
}
.dropdown-toggle svg {
  width: 12px;
  height: 12px;
  transition: transform .2s;
}
.dropdown-menu {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  min-width: 195px;
  padding: 18px 0 10px;
  background: #fff;
  border: 1px solid #eee;
  box-shadow: 0 12px 25px rgba(0,0,0,.07);
  text-align: left;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .2s, visibility .2s;
  z-index: 200;
}
.dropdown-menu a {
  display: block;
  padding: 13px 22px;
  border-bottom: 0 !important;
  font-family: Barlow, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 1.3px;
  text-decoration: none;
  white-space: nowrap;
}
.dropdown-menu a:hover,
.dropdown-menu a:focus-visible {
  background: #f5f6f8;
}
.nav-dropdown:hover .dropdown-menu,
.nav-dropdown:focus-within .dropdown-menu,
.nav-dropdown.is-open .dropdown-menu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.nav-dropdown:hover .dropdown-toggle svg,
.nav-dropdown:focus-within .dropdown-toggle svg,
.nav-dropdown.is-open .dropdown-toggle svg {
  transform: rotate(180deg);
}

/* PRODUCT LAYOUT */

.back {
  display: block;
  max-width: 1200px;
  margin: 30px auto 0;
  padding: 0 30px;
  font-family: Barlow, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--muted);
  text-decoration: none;
}
.product-layout {
  max-width: 1200px;
  margin: 35px auto 100px;
  padding: 0 30px;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 80px;
  align-items: start;
}
.main-image {
  background: #f7f7f7;
  aspect-ratio: 4 / 5;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.main-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.details h1 {
  margin: 0 0 18px;
  font-family: Barlow, Arial, sans-serif;
  font-size: 28px;
  font-weight: 400;
  letter-spacing: 2px;
  line-height: 1.3;
}
.metal {
  margin: 0 0 30px;
  font-family: Barlow, Arial, sans-serif;
  font-size: 14px;
  color: var(--muted);
}
.price {
  margin: 0 0 35px;
  font-family: Barlow, Arial, sans-serif;
  font-size: 17px;
}
.variants {
  display: flex;
  gap: 12px;
  margin-bottom: 35px;
}
.variant {
  width: 65px;
  height: 75px;
  border: 1px solid #ddd;
  background: #f7f7f7;
  padding: 3px;
  text-decoration: none;
}
.variant.active { border-color: var(--navy); }
.variant img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.description {
  font-size: 14px;
  line-height: 1.9;
  color: #4a4a4a;
  margin: 0 0 28px;
}

/* SIZES */

.size-section {
  margin: 30px 0;
  padding: 25px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.section-heading {
  font-family: Barlow, Arial, sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 1.5px;
  margin: 0 0 15px;
}
.size-heading-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.size-heading-row .section-heading { margin: 0; }
.guide-link, .custom-size-link {
  background: none;
  border: 0;
  border-bottom: 1px solid var(--navy);
  padding: 0 0 4px;
  font-family: Barlow, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: .7px;
  color: var(--navy);
  cursor: pointer;
}
.ring-size-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
}
.ring-size-button {
  min-height: 43px;
  background: #fff;
  border: 1px solid #ccc;
  color: var(--navy);
  font-family: Barlow, Arial, sans-serif;
  font-size: 13px;
  cursor: pointer;
}
.ring-size-button:hover { border-color: var(--navy); }
.ring-size-button.selected {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}
.size-options {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 15px;
}
.size-option { cursor: pointer; }
.size-option input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}
.size-option span {
  display: inline-block;
  padding: 12px 22px;
  border: 1px solid #ccc;
  font-family: Barlow, Arial, sans-serif;
  font-size: 13px;
}
.size-option input:checked + span {
  border-color: var(--navy);
  background: #f5f6f8;
}
.size-option input:focus-visible + span {
  outline: 2px solid var(--navy);
  outline-offset: 3px;
}
.custom-size-box { margin-top: 18px; }
.custom-size-box label {
  display: block;
  font-family: Barlow, Arial, sans-serif;
  font-size: 12px;
  margin-bottom: 8px;
}
.small-note {
  color: var(--muted);
  font-family: Barlow, Arial, sans-serif;
  font-size: 12px;
  line-height: 1.8;
  margin: 12px 0 0;
}

/* MATERIALS */

.materials {
  padding: 25px 0;
  border-bottom: 1px solid var(--line);
}
.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 12px 0;
  border-bottom: 1px solid #f1f1f1;
  font-family: Barlow, Arial, sans-serif;
  font-size: 12px;
  line-height: 1.7;
}
.detail-row:last-child { border-bottom: 0; }
.detail-label { color: var(--muted); }
.detail-value { text-align: right; }

/* DELIVERY */

.delivery {
  padding: 24px 0;
  border-bottom: 1px solid var(--line);
  font-family: Barlow, Arial, sans-serif;
}
.delivery-line {
  display: flex;
  align-items: center;
  gap: 10px;
}
.delivery-line p {
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
}
.info-button {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  padding: 0;
  border: 1px solid var(--navy);
  border-radius: 50%;
  background: #fff;
  color: var(--navy);
  font-size: 12px;
  cursor: pointer;
}

/* PURCHASE */

.purchase-button, .submit-button {
  width: 100%;
  padding: 18px;
  margin-top: 35px;
  background: var(--blue);
  color: #fff;
  border: 0;
  font-family: Barlow, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
}
.purchase-button:hover,
.submit-button:hover { background: var(--navy); }
.purchase-form { margin-top: 30px; }
.form-heading {
  font-family: Barlow, Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
}
.form-field {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 0;
  background: #fff;
  color: var(--navy);
  font-family: Barlow, Arial, sans-serif;
  font-size: 14px;
}
.form-note {
  font-family: Barlow, Arial, sans-serif;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.8;
}
.submit-button:disabled {
  opacity: .6;
  cursor: wait;
}

/* POPUPS */

.info-dialog {
  border: 0;
  width: min(92%, 650px);
  max-height: 88vh;
  overflow-y: auto;
  padding: 35px;
  background: #fff;
  color: var(--navy);
  box-shadow: 0 10px 50px rgba(0,0,0,.12);
}
.info-dialog::backdrop {
  background: rgba(0,0,0,.55);
}
.dialog-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 25px;
}
.dialog-header h2 {
  margin: 0;
  font-family: Barlow, Arial, sans-serif;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 1px;
}
.close-dialog {
  border: 0;
  background: none;
  color: var(--navy);
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
}
.info-dialog p {
  font-family: Barlow, Arial, sans-serif;
  font-size: 13px;
  line-height: 1.9;
  color: #4a4a4a;
}
.guide-table {
  width: 100%;
  border-collapse: collapse;
  margin: 22px 0;
  font-family: Barlow, Arial, sans-serif;
  font-size: 13px;
}
.guide-table th {
  background: #f7f7f7;
  font-weight: 500;
  text-align: left;
}
.guide-table th, .guide-table td {
  width: 50%;
  padding: 13px 15px;
  border-bottom: 1px solid var(--line);
}
.guide-table tr.highlighted {
  background: #f1f4f7;
  font-weight: 600;
}
.guide-table tbody tr { cursor: pointer; }
.guide-table tbody tr:hover { background: #f7f8fa; }
.guide-table tbody tr:focus-visible {
  outline: 2px solid var(--navy);
  outline-offset: -2px;
}

/* MOBILE */

@media (max-width: 700px) {
  .site-header { padding: 22px 15px 16px; }
  .logo { font-size: 24px; letter-spacing: 3px; }
  .main-nav { gap: 13px; }
  .main-nav a { font-size: 10px; letter-spacing: .7px; }
  .nav-dropdown { gap: 2px; }
  .dropdown-menu {
    left: 0;
    transform: none;
    min-width: 175px;
  }
  .language-switch { margin-left: 3px; gap: 7px; }
  .product-layout {
    grid-template-columns: 1fr;
    gap: 35px;
    margin: 20px auto 65px;
    padding: 0 16px;
  }
  .back { padding: 0 16px; }
  .details h1 { font-size: 23px; }
  .ring-size-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .info-dialog { padding: 22px; }
  .guide-table th, .guide-table td {
    padding: 12px 9px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .dropdown-menu, .dropdown-toggle svg,
  .variant img { transition: none; }
}
</style>
</head>

<body>

<header class="site-header">
  <a id="logoLink" class="logo" href="/">FYRSTERLING</a>

  <nav class="main-nav" id="mainNav" aria-label="Main navigation">

    <div class="nav-dropdown" id="jewelleryDropdown">
      <a id="navJewellery" class="active"></a>

      <button
        type="button"
        class="dropdown-toggle"
        id="jewelleryToggle"
        aria-label="Show jewellery categories"
        aria-expanded="false"
        aria-controls="jewelleryMenu"
      >
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5"
             aria-hidden="true">
          <path d="M5 9l7 7 7-7"/>
        </svg>
      </button>

      <div class="dropdown-menu" id="jewelleryMenu">
        <a data-category="rings"></a>
        <a data-category="bracelets"></a>
        <a data-category="necklaces"></a>
        <a data-category="earrings"></a>
      </div>
    </div>

    <a id="navServices"></a>
    <a id="navMaison"></a>
    <a id="navAppointments"></a>
    <a id="navContact"></a>
    <a id="navFaq"></a>

    <span class="language-switch" aria-label="Select language">
      <a id="languageDa" lang="da">DA</a>
      <span aria-hidden="true">|</span>
      <a id="languageEn" lang="en">EN</a>
    </span>
  </nav>
</header>

<a class="back" id="backLink"></a>

<main class="product-layout">

  <div class="main-image">
    <img id="mainImage" alt="AETERNUM jewellery">
  </div>

  <section class="details">

    <h1 id="productName"></h1>
    <p class="metal" id="metalName"></p>
    <p class="price" id="productPrice"></p>

    <div class="variants" id="variants"></div>

    <p class="description" id="productDescription"></p>

    <!-- RING SIZES -->

    <div class="size-section" id="ringSizeSection" hidden>
      <div class="size-heading-row">
        <p class="section-heading" id="ringSizeHeading"></p>
        <button type="button" class="guide-link"
                id="openSizeGuide"></button>
      </div>
      <div class="ring-size-grid" id="ringSizeGrid"
           role="group" aria-label="Ring size"></div>
      <p class="small-note" id="ringSizeNote"></p>
    </div>

    <!-- BRACELET SIZES -->

    <div class="size-section" id="braceletSizeSection" hidden>
      <p class="section-heading" id="braceletSizeHeading"></p>

      <div class="size-options" role="group">
        <label class="size-option">
          <input type="radio" name="braceletSizeChoice" value="17.5">
          <span id="braceletSize175"></span>
        </label>
        <label class="size-option">
          <input type="radio" name="braceletSizeChoice" value="18.5">
          <span id="braceletSize185"></span>
        </label>
      </div>

      <button type="button" class="custom-size-link"
              id="customBraceletButton"
              aria-expanded="false"></button>

      <div class="custom-size-box" id="customBraceletBox" hidden>
        <label for="customBraceletInput"
               id="customBraceletLabel"></label>
        <input type="number" id="customBraceletInput"
               class="form-field" min="1" max="40"
               step="any" inputmode="decimal">
        <p class="small-note" id="customBraceletNote"></p>
      </div>
    </div>

    <!-- NECKLACE LENGTH -->

    <div class="size-section" id="necklaceLengthSection" hidden>
      <p class="section-heading" id="necklaceLengthHeading"></p>
      <p class="description" id="standardLengthText"></p>

      <button type="button" class="custom-size-link"
              id="customNecklaceButton"
              aria-expanded="false"></button>

      <div class="custom-size-box" id="customNecklaceBox" hidden>
        <label for="customNecklaceInput"
               id="customNecklaceLabel"></label>
        <input type="number" id="customNecklaceInput"
               class="form-field" min="1" max="150"
               step="any" inputmode="decimal">
        <p class="small-note" id="customNecklaceNote"></p>
      </div>
    </div>

    <!-- MATERIALS AND DETAILS -->

    <div class="materials">
      <p class="section-heading" id="materialsHeading"></p>

      <div class="detail-row">
        <span class="detail-label" id="collectionLabel"></span>
        <span class="detail-value">AETERNUM</span>
      </div>

      <div class="detail-row">
        <span class="detail-label" id="materialLabel"></span>
        <span class="detail-value" id="materialDetail"></span>
      </div>

      <div class="detail-row" id="ringSizeDetailRow" hidden>
        <span class="detail-label" id="ringSizeDetailLabel"></span>
        <span class="detail-value" id="ringSizeDetail"></span>
      </div>

      <div class="detail-row" id="necklaceLengthRow" hidden>
        <span class="detail-label" id="lengthLabel"></span>
        <span class="detail-value" id="lengthDetail"></span>
      </div>

      <div class="detail-row" id="diamondRow" hidden>
        <span class="detail-label" id="diamondLabel"></span>
        <span class="detail-value" id="diamondDetail"></span>
      </div>
    </div>

    <!-- DELIVERY -->

    <div class="delivery" id="deliverySection" hidden>
      <div class="delivery-line">
        <p id="deliveryText"></p>
        <button type="button" class="info-button"
                id="deliveryInfoButton"
                aria-label="Delivery information">?</button>
      </div>
    </div>

    <!-- PURCHASE -->

    <button type="button" class="purchase-button"
            id="purchaseButton"
            aria-expanded="false"></button>

    <form
      id="purchaseForm"
      class="purchase-form"
      hidden
      action="https://formspree.io/f/xjyyogbg"
      method="POST"
    >
      <input type="hidden" name="product" id="requestedProduct">

      <input type="hidden" name="ring_size"
             id="requestedRingSize" disabled>

      <input type="hidden" name="bracelet_size"
             id="requestedBraceletSize" disabled>

      <input type="hidden" name="necklace_length"
             id="requestedNecklaceLength" disabled>

      <p class="form-heading" id="formHeading"></p>
      <p class="form-note" id="formIntro"></p>

      <input class="form-field" type="text"
             name="name" id="fieldName"
             autocomplete="name" required>

      <input class="form-field" type="email"
             name="email" id="fieldEmail"
             autocomplete="email" required>

      <input class="form-field" type="tel"
             name="phone" id="fieldPhone"
             autocomplete="tel" required>

      <input class="form-field" type="text"
             name="address" id="fieldAddress"
             autocomplete="street-address" required>

      <input class="form-field" type="text"
             name="postal_code" id="fieldPostcode"
             autocomplete="postal-code" required>

      <input class="form-field" type="text"
             name="city" id="fieldCity"
             autocomplete="address-level2" required>

      <p class="form-note" id="formDisclaimer"></p>

      <button type="submit" class="submit-button"
              id="submitButton"></button>
    </form>

  </section>
</main>

<!-- RING SIZE GUIDE -->

<dialog class="info-dialog" id="sizeGuideDialog"
        aria-labelledby="sizeGuideTitle">
  <div class="dialog-header">
    <h2 id="sizeGuideTitle"></h2>
    <button type="button" class="close-dialog"
            id="closeSizeGuide"
            aria-label="Close">&times;</button>
  </div>

  <p id="guideIntro"></p>

  <table class="guide-table">
    <thead>
      <tr>
        <th id="guideCircumferenceColumn"></th>
        <th id="guideSizeColumn"></th>
      </tr>
    </thead>
    <tbody id="guideTableBody"></tbody>
  </table>

  <p class="section-heading" id="guideMethodHeading"></p>
  <p id="guideMethod"></p>
  <p class="small-note" id="guideNote"></p>
</dialog>

<!-- DELIVERY INFORMATION -->

<dialog class="info-dialog" id="deliveryDialog"
        aria-labelledby="deliveryDialogTitle">
  <div class="dialog-header">
    <h2 id="deliveryDialogTitle"></h2>
    <button type="button" class="close-dialog"
            id="closeDeliveryDialog"
            aria-label="Close">&times;</button>
  </div>
  <p id="deliveryDialogText"></p>
</dialog>

<script>
"use strict";

/* LANGUAGE */

const isEnglish = location.pathname.startsWith("/en/");
const lang = isEnglish ? "en" : "da";
document.documentElement.lang = lang;

const translations = {
  da: {
    navJewellery: "SMYKKER",
    navServices: "SERVICES",
    navMaison: "MAISON",
    navAppointments: "BOOK TID",

    back: "← TILBAGE TIL KOLLEKTIONEN",

      bracelets: "ARMBÅND",
      necklaces: "HALSKÆDER",
      earrings: "ØRERINGE"

    productTypes: {
      Ring: "RING",
      Necklace: "HALSKÆDE",
      Earrings: "ØRERINGE",
      Bracelet: "ARMBÅND"

      "Rose Gold": "14 KARAT ROSAGULD",
      Silver: "STERLINGSØLV"
    },
    materialDetails: {
      "Yellow Gold": "Massivt 14 karat guld",
      "Rose Gold": "Massivt 14 karat rosaguld",
      Silver: "Sterlingsølv 925/1000, rhodiumbelagt"
    },
    descriptions: {
      Ring:
        "AETERNUM-ringen forener raffineret enkelhed " +
        "med tidløs elegance. Dens harmoniske design " +

function imagePath(selectedMetal) {

function productUrl(language, selectedMetal = metal) {
  const path = language === "en"
    ? "/en/product.html"
    : "/product.html";

  return path + "?" + new URLSearchParams({
    type,
    metal: selectedMetal
  }).toString();
}

function localPath(path) {
  return isEnglish ? "/en" + path : path;
}

function setDropdownOpen(open) {
  dropdown.classList.toggle("is-open", open);
  dropdownToggle.setAttribute("aria-expanded", String(open));
}

dropdownToggle.addEventListener("click", () => {
  setDropdownOpen(!dropdown.classList.contains("is-open"));
});

dropdown.addEventListener("mouseenter", () => {
  if (matchMedia("(hover: hover)").matches) {
    setDropdownOpen(true);
  }
});

dropdown.addEventListener("mouseleave", () => {
  setDropdownOpen(false);
});

dropdown.addEventListener("focusin", () => {
  setDropdownOpen(true);
});

dropdown.addEventListener("focusout", event => {
  if (!dropdown.contains(event.relatedTarget)) {
    setDropdownOpen(false);
  }
});

document.addEventListener("click", event => {
  if (!dropdown.contains(event.target)) {
    setDropdownOpen(false);
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    setDropdownOpen(false);
    dropdownToggle.blur();
  }
});

/* SIZE HELPERS */

function parseLength(input, maximum) {
  const raw = input.value.trim().replace(",", ".");
  const number = Number(raw);

  if (
    !raw ||
    !Number.isFinite(number) ||
    number <= 0 ||
    number > maximum
  ) {
    return null;
  }

  return number;
}

function formatCm(number) {
  return number.toLocaleString(
    isEnglish ? "en-GB" : "da-DK",
    { maximumFractionDigits: 2 }
  ) + " cm";
}

function getBraceletSize() {
  if (!isBracelet) return "";

  if (!$("customBraceletBox").hidden) {
    const number = parseLength(
      $("customBraceletInput"), 40
    );

    return number === null
      ? ""
      : t.customBraceletPrefix + ": " + formatCm(number);
  }

  const selected = document.querySelector(
    'input[name="braceletSizeChoice"]:checked'
  );

  return selected
    ? formatCm(Number(selected.value))
    : "";
}

function getNecklaceLength() {
  if (!isNecklace) return "";

  if ($("customNecklaceBox").hidden) {
    return t.standard;
  }

  const number = parseLength(
    $("customNecklaceInput"), 150
  );

  return number === null
    ? ""
    : t.customNecklacePrefix + ": " + formatCm(number);
}

setText("formHeading", t.formHeading);
setText("formIntro", t.formIntro);
setText("formDisclaimer", t.disclaimer);
setText("submitButton", t.submit);

const formFields = [
  ["fieldName", t.name],
  ["fieldEmail", t.email],
  ["fieldPhone", t.phone],
  ["fieldAddress", t.address],
  ["fieldPostcode", t.postcode],
  ["fieldCity", t.city]
];

formFields.forEach(([id, label]) => {
  $(id).placeholder = label;
  $(id).setAttribute("aria-label", label);
});

/* VALIDATION */

function validateProductSelection() {
  if (isRing && selectedRingSize === null) {
    alert(t.ringError);
    $("ringSizeSection").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
    return false;
  }

  if (isBracelet && !getBraceletSize()) {
    alert(t.braceletError);
    $("braceletSizeSection").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
    return false;
  }

  if (isNecklace && !getNecklaceLength()) {
    alert(t.necklaceError);
    $("necklaceLengthSection").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
    return false;
  }

  return true;
}

/* OPEN PURCHASE FORM */

$("purchaseButton").addEventListener("click", () => {
  if (!validateProductSelection()) return;

  $("purchaseForm").hidden = false;
  $("purchaseButton").setAttribute(
    "aria-expanded", "true"
  );

  $("purchaseForm").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
});

/* SUBMIT PURCHASE REQUEST */

$("purchaseForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!validateProductSelection()) return;

  const ringInput = $("requestedRingSize");
  const braceletInput = $("requestedBraceletSize");
  const necklaceInput = $("requestedNecklaceLength");

  ringInput.disabled = !isRing;
  braceletInput.disabled = !isBracelet;
  necklaceInput.disabled = !isNecklace;

  ringInput.value = isRing ? "EU " + selectedRingSize : "";
  braceletInput.value = getBraceletSize();
  necklaceInput.value = getNecklaceLength();

  const submitButton = $("submitButton");
  submitButton.disabled = true;
  submitButton.textContent = t.sending;

  try {
    const response = await fetch(
      $("purchaseForm").action,
      {
        method: "POST",
        body: new FormData($("purchaseForm")),
        headers: { Accept: "application/json" }
      }
    );

    if (!response.ok) {
      throw new Error("Form submission failed");
    }

    location.href = isEnglish
      ? "/en/thank-you.html"
      : "/thank-you.html";

  } catch (error) {
    alert(t.error);
    submitButton.disabled = false;
    submitButton.textContent = t.submit;
  }
});
</script>

<style>
  .gold-gallery-stage {
    position: relative;
    aspect-ratio: 3 / 4;
    touch-action: pan-y;
  }

  .gold-gallery-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 44px;
    padding: 0;
    border: 1px solid #e8e8e8;
    background: rgba(255,255,255,.94);
    color: #142a46;
    display: grid;
    place-items: center;
    cursor: pointer;
    z-index: 5;
  }

  .gold-gallery-arrow svg {
    width: 18px;
    height: 18px;
  }

  .gold-gallery-prev {
    left: 12px;
  }

  .gold-gallery-next {
    right: 12px;
  }

  .gold-gallery-thumbnails {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
  }

  .gold-gallery-thumb {
    width: 75px;
    aspect-ratio: 3 / 4;
    padding: 3px;
    border: 1px solid #ddd;
    background: #f7f7f7;
    cursor: pointer;
  }

  .gold-gallery-thumb.active {
    border-color: #142a46;
  }

  .gold-gallery-thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .gold-gallery-arrow:focus-visible,
  .gold-gallery-thumb:focus-visible {
    outline: 2px solid #142a46;
    outline-offset: 3px;
  }

  @media (max-width: 700px) {
    .gold-gallery-thumbnails {
      gap: 8px;
    }

    .gold-gallery-thumb {
      width: 62px;
    }

    .gold-gallery-arrow {
      width: 32px;
      height: 38px;
    }
  }
</style>

<script>
(function () {
  "use strict";

  const parameters =
    new URLSearchParams(window.location.search);

  const selectedType = parameters.get("type");
  const selectedMetal = parameters.get("metal");

  if (
    selectedType !== "Necklace" ||
    selectedMetal !== "Yellow Gold"
  ) {
    return;
  }

  const english =
    window.location.pathname.startsWith("/en/");

  const mainImage =
    document.getElementById("mainImage");

  if (
    !mainImage ||
    document.getElementById("galleryThumbnails") ||
    document.getElementById("goldGallery")
  ) {
    return;
  }

  const imageContainer =
    mainImage.closest(".main-image");

  if (!imageContainer) return;

  const images = [
    {
      src: mainImage.getAttribute("src"),
      alt: english
        ? "AETERNUM necklace in 14K yellow gold"
        : "AETERNUM halskæde i 14 karat guld"
    },
    {
      src: "/images/" +
        encodeURIComponent("Guld halskæde bagfra.jpg"),
      alt: english
        ? "AETERNUM necklace viewed from behind"
        : "AETERNUM halskæde set bagfra"
    },
    {
      src: "/images/" +
        encodeURIComponent("Krans på guld smykke.PNG"),
      alt: english
        ? "Detail of the AETERNUM wreath"
        : "Detalje af AETERNUM-kransen"
    },
    {
      src: "/images/" +
        encodeURIComponent("Logo på guld smykke.PNG"),
      alt: english
        ? "Detail of the FYRSTERLING logo"
        : "Detalje af FYRSTERLING-logoet"
    }
  ];

  let currentImage = 0;

  const gallery = document.createElement("div");

  gallery.id = "goldGallery";
  gallery.style.minWidth = "0";

  gallery.setAttribute("role", "group");

  gallery.setAttribute(
    "aria-label",
    english ? "Product images" : "Produktbilleder"
  );

  imageContainer.parentNode.insertBefore(
    gallery,
    imageContainer
  );

  gallery.appendChild(imageContainer);

  imageContainer.classList.add(
    "gold-gallery-stage"
  );

  mainImage.draggable = false;

  const previousButton =
    document.createElement("button");

  previousButton.type = "button";

  previousButton.className =
    "gold-gallery-arrow gold-gallery-prev";

  previousButton.setAttribute(
    "aria-label",
    english ? "Previous image" : "Forrige billede"
  );

  previousButton.innerHTML = `
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.5"
         aria-hidden="true">
      <path d="M15 5l-7 7 7 7"/>
    </svg>
  `;

  const nextButton =
    document.createElement("button");

  nextButton.type = "button";

  nextButton.className =
    "gold-gallery-arrow gold-gallery-next";

  nextButton.setAttribute(
    "aria-label",
    english ? "Next image" : "Næste billede"
  );

  nextButton.innerHTML = `
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.5"
         aria-hidden="true">
      <path d="M9 5l7 7-7 7"/>
    </svg>
  `;

  imageContainer.appendChild(previousButton);
  imageContainer.appendChild(nextButton);

  const thumbnails =
    document.createElement("div");

  thumbnails.className =
    "gold-gallery-thumbnails";

  gallery.appendChild(thumbnails);

  const thumbnailButtons = [];

  images.forEach(function (image, index) {
    const button =
      document.createElement("button");

    button.type = "button";
    button.className = "gold-gallery-thumb";

    button.setAttribute(
      "aria-label",
      image.alt
    );

    button.setAttribute(
      "aria-pressed",
      "false"
    );

    const thumbnail =
      document.createElement("img");

    thumbnail.src = image.src;
    thumbnail.alt = "";
    thumbnail.loading = "lazy";

    button.appendChild(thumbnail);

    button.addEventListener("click", function () {
      showImage(index);
    });

    thumbnails.appendChild(button);
    thumbnailButtons.push(button);
  });

  function showImage(index) {
    currentImage =
      (index + images.length) % images.length;

    mainImage.src = images[currentImage].src;
    mainImage.alt = images[currentImage].alt;

    thumbnailButtons.forEach(
      function (button, buttonIndex) {
        const active =
          buttonIndex === currentImage;

        button.classList.toggle(
          "active",
          active
        );

        button.setAttribute(
          "aria-pressed",
          String(active)
        );
      }
    );
  }

  previousButton.addEventListener(
    "click",
    function () {
      showImage(currentImage - 1);
    }
  );

  nextButton.addEventListener(
    "click",
    function () {
      showImage(currentImage + 1);
    }
  );

  gallery.addEventListener(
    "keydown",
    function (event) {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        showImage(currentImage - 1);
      }

      if (event.key === "ArrowRight") {
        event.preventDefault();
        showImage(currentImage + 1);
      }
    }
  );

  let touchStartX = 0;
  let touchStartY = 0;

  imageContainer.addEventListener(
    "touchstart",
    function (event) {
      touchStartX =
        event.changedTouches[0].screenX;

      touchStartY =
        event.changedTouches[0].screenY;
    },
    { passive: true }
  );

  imageContainer.addEventListener(
    "touchend",
    function (event) {
      const differenceX =
        event.changedTouches[0].screenX -
        touchStartX;

      const differenceY =
        event.changedTouches[0].screenY -
        touchStartY;

      if (
        Math.abs(differenceX) > 45 &&
        Math.abs(differenceX) >
        Math.abs(differenceY)
      ) {
        if (differenceX < 0) {
          showImage(currentImage + 1);
        } else {
          showImage(currentImage - 1);
        }
      }
    },
    { passive: true }
  );

  showImage(0);

})();
</script>

  
</body>
