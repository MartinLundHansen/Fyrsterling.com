<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETERNUM Collection | FYRSTERLING</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

   .header a {
  color: #142a46;
  text-decoration: none;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 30px;
  letter-spacing: 0.12em;
  font-weight: normal;
}
.main-nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px 26px;
  margin-top: 22px;
  font-family: Arial, sans-serif;
}

.main-nav a {
  color: #142a46;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 0.13em;
  font-weight: normal;
}

.main-nav a:hover,
.main-nav a[aria-current="page"] {
  color: #004f71;
  text-decoration: underline;
  text-underline-offset: 6px;
}
    .intro {
      text-align: center;
      padding: 75px 20px 55px;
    }

    .intro h1 {
      font-size: 36px;
      font-weight: 400;
      letter-spacing: 5px;
      margin: 0 0 15px;
    }

    .intro p {
      font-size: 13px;
      letter-spacing: 2px;
      color: #777;
    }

    .collection {
      max-width: 1400px;
      margin: auto;
      padding: 20px 35px 100px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 60px 25px;
    }

    .product {
      text-align: center;
    }

    .product-image {
      aspect-ratio: 1 / 1;
      background: #f6f5f3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 12px;
    }

    .product h2 {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1px;
      margin: 20px 0 10px;
    }

    .product p {
      font-size: 13px;
      color: #777;
      margin: 8px 0;
    }

    @media (max-width: 700px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 35px 12px;
      }

      .collection {
        padding: 15px 12px 60px;
      }

      .intro {
        padding: 55px 20px 35px;
      }

      .intro h1 {
        font-size: 28px;
      }
    }
    
/* FYRSTERLING – Responsive collection */

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

.collection {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 30px 90px;
}

.products {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 48px 24px;
  width: 100%;
}

.product {
  min-width: 0;
  width: 100%;
  text-align: center;
}

.product-image {
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: #f7f7f7;
}

.product-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

@media (max-width: 700px) {
  .collection {
    padding: 24px 12px 60px;
  }

  .products {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 30px 12px;
  }

  .product h2 {
    font-size: 13px;
    line-height: 1.4;
  }

  .product p {
    font-size: 12px;
    line-height: 1.5;
  }
}

  </style>
</head>

<body>

  <header class="header">
    <a href="/">FYRSTERLING</a>
    <nav class="main-nav" aria-label="Main navigation">
  <a href="/collection.html" aria-current="page">JEWELLERY</a>
  <a href="/services.html">SERVICES</a>
  <a href="/our-story.html">MAISON</a>
  <a href="/appointments.html">APPOINTMENTS</a>
  <a href="/contact.html">CONTACT</a>
  <a href="/faq.html">FAQ</a>
</nav>
  </header>

  <section class="intro">
    <h1>AETERNUM</h1>
    <p>THE COLLECTION</p>
  </section>

  <main class="collection">
    <div class="products" id="products"></div>
  </main>

  <script>
    const products = [
      ["Ring", "Yellow Gold"],
      ["Necklace", "Silver"],
      ["Earrings", "Rose Gold"],
      ["Bracelet", "Yellow Gold"],
      ["Ring", "Silver"],
      ["Necklace", "Rose Gold"],
      ["Bracelet", "Silver"],
      ["Earrings", "Yellow Gold"],
      ["Necklace", "Yellow Gold"],
      ["Ring", "Rose Gold"],
      ["Earrings", "Silver"],
      ["Bracelet", "Rose Gold"]
    ];

   
const metals = {
  "Yellow Gold": "Guld",
  "Rose Gold": "Rose gold",
  "Silver": "Sølv"
};

const types = {
  "Ring": "ring",
  "Necklace": "halskæde",
  "Earrings": "øreringe",
  "Bracelet": "armbånd"
};

const prices = {
  "Ring": {
    "Yellow Gold": 9600,
    "Rose Gold": 9600,
    "Silver": 3200
  },
  "Earrings": {
    "Yellow Gold": 5200,
    "Rose Gold": 5200,
    "Silver": 3000
  },
  "Necklace": {
    "Yellow Gold": 9100,
    "Rose Gold": 9100,
    "Silver": 3600
  },
  "Bracelet": {
    "Yellow Gold": 6500,
    "Rose Gold": 6500,
    "Silver": 3200
  }
};

document.getElementById("products").innerHTML =
  products.map(([name, metal]) => {
    const filename = `${metals[metal]} ${types[name]}.jpeg`;

    return `
      <article class="product">
<a class="product-image" href="/product.html?type=${encodeURIComponent(name)}&metal=${encodeURIComponent(metal)}">
          <img
            src="/images/${encodeURIComponent(filename)}"
            alt="AETERNUM ${name} – ${metal}"
            loading="lazy"
          >
</a>
        <h2>AETERNUM ${name.toUpperCase()}</h2>
        <p>${metal}</p>
<p>${prices[name][metal].toLocaleString("da-DK")} DKK</p>
      </article>
    `;
  }).join("");

  </script>

</body>
</html>
